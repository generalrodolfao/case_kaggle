taxi_pipeline:
  target: dev
  outputs:
    dev:
      type: duckdb
      # DuckDB persiste em /tmp durante execução; dados reais ficam no MinIO via httpfs
      path: /tmp/taxi_pipeline.duckdb
      extensions:
        - httpfs
      settings:
        # S3_HOST_PORT deve ser hostname:porta sem protocolo (ex: minio:9000)
        s3_endpoint: "{{ env_var('S3_HOST_PORT', 'minio:9000') }}"
        s3_access_key_id: "{{ env_var('S3_ACCESS_KEY', 'minio') }}"
        s3_secret_access_key: "{{ env_var('S3_SECRET_KEY', 'CHANGE_ME') }}"
        s3_url_style: "path"
        s3_use_ssl: "false"
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '4GB') }}"
