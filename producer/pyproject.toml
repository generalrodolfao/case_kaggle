[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nyc-taxi-producer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.3,<3.0",
    "polars>=0.20,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
all = []
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/producer"]
